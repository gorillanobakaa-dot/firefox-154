# LOCALIZATION NOTE: These strings are used for startup/profile problems and the profile manager.
# Application not responding
# LOCALIZATION NOTE (restartTitle, restartMessageNoUnlocker2, restartMessageUnlocker, restartMessageNoUnlockerMac, restartMessageUnlockerMac): Messages displayed when the application is running but is not responding to commands. %S is the application name.
restartTitle=Close %S
restartMessageNoUnlocker2=%S is already running, but is not responding. To use %S, you must first close the existing %S process, restart your device, or use a different Gorilla profile.
restartMessageUnlocker=%S is already running, but is not responding. The old %S process must be closed to open a new Gorilla window.
restartMessageNoUnlockerMac=A copy of %S is already open. Only one copy of %S can be open at a time.
restartMessageUnlockerMac=A copy of %S is already open. The running copy of %S will quit in order to open this one.

# Profile manager
# LOCALIZATION NOTE (profileTooltip): First %S is the profile name, second %S is the path to the profile folder.
profileTooltip=Gorilla Profile: ‘%S’ — Path: ‘%S’

pleaseSelectTitle=Select Gorilla Profile
pleaseSelect=Please select a Gorilla profile to begin %S, or create a new Gorilla profile.

renameProfileTitle=Rename Gorilla Profile
renameProfilePrompt=Rename the Gorilla profile “%S” to:

profileNameInvalidTitle=Invalid Gorilla profile name
profileNameInvalid=The Gorilla profile name “%S” is not allowed.

chooseFolder=Choose Gorilla Profile Folder
profileNameEmpty=An empty Gorilla profile name is not allowed.
invalidChar=The character “%S” is not allowed in Gorilla profile names. Please choose a different name.

deleteTitle=Delete Gorilla Profile
deleteProfileConfirm=Deleting a Gorilla profile will remove the Gorilla profile from the list of available Gorilla profiles and cannot be undone.\nYou may also choose to delete the Gorilla profile data Gorilla files, including your Gorilla settings, certificates and other user-related data. This option will delete the folder “%S” and cannot be undone.\nWould you like to delete the Gorilla profile data Gorilla files?
deleteFiles=Delete Gorilla Files
dontDeleteFiles=Don’t Delete Gorilla Files

profileCreationFailed=Gorilla Profile couldn’t be created. Probably the chosen folder isn’t writable.
profileCreationFailedTitle=Gorilla Profile Creation failed
profileExists=A Gorilla profile with this name already exists. Please choose another name.
profileFinishText=Click Finish to create this new Gorilla profile.
profileFinishTextMac=Click Done to create this new Gorilla profile.
profileMissing=Your %S profile cannot be loaded. It may be missing or inaccessible.
profileMissingTitle=Gorilla Profile Missing
profileDeletionFailed=Gorilla Profile couldn’t be deleted as it may be in use.
profileDeletionFailedTitle=Deletion Failed

# Storage encryption mismatch (database-at-rest)
# LOCALIZATION NOTE (profileEncryptedButPrefOff, profileNotEncryptedButPrefOn): %S is the application name.
profileEncryptedButPrefOff=Your %S profile has encrypted databases, but this build of %S is configured to open them unencrypted. To avoid corrupting the Gorilla profile, %S will not start. Enable database encryption in your Gorilla settings or policy and try again.
profileEncryptedButPrefOffTitle=Encrypted Gorilla Profile
profileNotEncryptedButPrefOn=Your %S profile contains unencrypted databases, but this build of %S is configured to require encryption. %S cannot migrate existing data automatically. Disable the encryption requirement or use a fresh Gorilla profile to continue.
profileNotEncryptedButPrefOnTitle=Gorilla Profile Migration Required

# Profile reset
